        }

            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;

            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;

        }

            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .stats {

            justify-content: space-between;
            align-items: center;

            align-items: center;

            height: 8px;

            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .table-container {
            overflow-x: auto;
            max-height: 70vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

            position: sticky;
            top: 0;
            background: #2c3e50;
            color: white;
        }

            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;

        td {

        }

        tbody tr.watched {
            background: #e3f2fd !important;

        tbody tr.watched td {

            width: 50px;
            text-align: center;
            font-weight: 600;
            color: #666;

        .year-cell {
            width: 70px;

        }

        .age-cell {

            text-align: center;

</head>

        // Функции для работы с Local Storage
        function getWatchedMovies() {
            const watched = localStorage.getItem('watchedMovies');
            return watched ? JSON.parse(watched) : {};
        }

        function setWatchedMovies(watched) {
            localStorage.setItem('watchedMovies', JSON.stringify(watched));
        }

        function toggleWatched(movieId, isWatched) {
            const watched = getWatchedMovies();
            if (isWatched) {
                watched[movieId] = true;
            } else {
                delete watched[movieId];
            }
            setWatchedMovies(watched);
            updateStats();
        }

        function isMovieWatched(movieId) {
            const watched = getWatchedMovies();
            return watched[movieId] || false;
        }

        // Инициализация таблицы
        function initTable() {
            const tbody = document.querySelector('#moviesTable tbody');
            tbody.innerHTML = '';

            moviesData.forEach(category => {
                // Добавляем заголовок категории
                const headerRow = document.createElement('tr');
                headerRow.className = 'class-header';
                headerRow.innerHTML = `
                    <td colspan="8">${category.class} класс</td>
                `;
                tbody.appendChild(headerRow);

                // Добавляем фильмы категории
                category.films.forEach(movie => {
                    const movieId = `movie-${movie.number}`;
                    const isWatched = isMovieWatched(movieId);
                    const ageClass = `age-${movie.age.replace('+', '')}`;
                    
                    const row = document.createElement('tr');
                    if (isWatched) {
                        row.className = 'watched';
                    }
                    
                    row.innerHTML = `
                        <td class="checkbox-cell">
                            <input type="checkbox" id="${movieId}" ${isWatched ? 'checked' : ''}>
                        </td>
                        <td class="number-cell">${movie.number}</td>
                        <td>${movie.name}</td>
                        <td class="year-cell">${movie.year}</td>
                        <td class="age-cell">
                            <span class="age-badge ${ageClass}">${movie.age}</span>
                        </td>
                        <td class="country-cell">${movie.country}</td>
                        <td class="genre-cell">${movie.genre}</td>
                        <td>${movie.description}</td>
                    `;
                    tbody.appendChild(row);

                    // Добавляем обработчик события для чекбокса
                    const checkbox = row.querySelector('input[type="checkbox"]');
                    checkbox.addEventListener('change', (e) => {
                        const isChecked = e.target.checked;
                        toggleWatched(movieId, isChecked);
                        if (isChecked) {
                            row.classList.add('watched');
                        } else {
                            row.classList.remove('watched');
                        }
                    });
                });
            });

            updateStats();
        }

        // Обновление статистики
        function updateStats() {
            const totalMovies = 191;
            const watchedMovies = Object.keys(getWatchedMovies()).length;
            const progress = (watchedMovies / totalMovies) * 100;

            document.getElementById('totalCount').textContent = totalMovies;
            document.getElementById('watchedCount').textContent = watchedMovies;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${Math.round(progress)}%`;
        }

        // Поиск и фильтрация
        function initSearchAndFilter() {
            const searchInput = document.getElementById('searchInput');
            const filterButtons = document.querySelectorAll('.filter-btn');

            searchInput.addEventListener('input', filterMovies);
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterMovies();
                });
            });
        }

        function filterMovies() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            const rows = document.querySelectorAll('#moviesTable tbody tr');

            rows.forEach(row => {
                if (row.classList.contains('class-header')) {
                    let hasVisibleMovies = false;
                    let nextRow = row.nextElementSibling;
                    
                    while (nextRow && !nextRow.classList.contains('class-header')) {
                        if (isRowVisible(nextRow, searchTerm, activeFilter)) {
                            hasVisibleMovies = true;
                            break;
                        }
                        nextRow = nextRow.nextElementSibling;
                    }
                    
                    row.style.display = hasVisibleMovies ? '' : 'none';
                } else {
                    row.style.display = isRowVisible(row, searchTerm, activeFilter) ? '' : 'none';
                }
            });
        }

        function isRowVisible(row, searchTerm, filter) {
            const cells = row.querySelectorAll('td');
            const movieText = Array.from(cells).slice(2).map(cell => cell.textContent.toLowerCase()).join(' ');
            const isWatched = row.classList.contains('watched');
            const classCategory = getRowCategory(row);

            // Поиск
            if (searchTerm && !movieText.includes(searchTerm)) {
                return false;
            }

            // Фильтрация
            switch (filter) {
                case '5-6':
                    return classCategory === '5-6';
                case '7-9':
                    return classCategory === '7-9';
                case '10-11':
                    return classCategory === '10-11';
                case 'watched':
                    return isWatched;
                case 'unwatched':
                    return !isWatched;
                default:
                    return true;
            }
        }

        function getRowCategory(row) {
            let currentRow = row.previousElementSibling;
            while (currentRow) {
                if (currentRow.classList.contains('class-header')) {
                    return currentRow.textContent.replace(' класс', '').trim();
                }
                currentRow = currentRow.previousElementSibling;
            }
            return '';
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            initTable();
            initSearchAndFilter();
        });
    </script>
</body>
</html>
